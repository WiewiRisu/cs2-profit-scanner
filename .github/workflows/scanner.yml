name: CS2 Profit Scanner

on:
  workflow_dispatch:

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz pliki projektu
        uses: actions/checkout@v4

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Uruchom skaner
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
        run: python scanner.py
        
      - name: Zapisz wyniki skanera
        uses: actions/upload-artifact@v4
        with:
          name: cs2-scanner-results
          path: results.json
          if-no-files-found: error
          retention-days: 7
