name: CS2 Profit Scanner

on:
  workflow_dispatch:
    inputs:
      budget_pln:
        description: 'Saldo CSFloat w PLN'
        required: true
        default: '0.97'
        type: string
      range_pln:
        description: 'Zakres +/- w PLN'
        required: true
        default: '0.25'
        type: string

permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz pliki projektu
        uses: actions/checkout@v4

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Uruchom skaner
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
        run: python scanner.py

      - name: Test szerszego wyszukiwania CSFloat
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
        run: python test_csfloat.py
        
      - name: Zapisz wyniki skanera
        uses: actions/upload-artifact@v4
        with:
          name: cs2-scanner-results
          path: results.json
          if-no-files-found: error
          retention-days: 7

      - name: Aktualizuj wyniki w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then
            echo "Wyniki bez zmian."
          else
            git commit -m "Aktualizacja cen CSFloat"
            git push
          fi
